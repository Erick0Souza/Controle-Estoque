services:

  postgres:
    image: postgres:16

    container_name: estoque-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estoque}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - estoque_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estoque}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: estoque-api

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-estoque}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET nao definida}

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}

      PORT: ${PORT:-8081}

    ports:
      - "${PORT:-8081}:8081"

    volumes:
      - estoque_uploads_data:/app/uploads


volumes:
  estoque_postgres_data:
  estoque_uploads_data: