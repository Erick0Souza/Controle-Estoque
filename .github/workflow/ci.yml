name: CI - Testes e Docker

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  testes:

    name: Testes automatizados

    runs-on: ubuntu-latest

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Mostrar versoes
        run: |
          java -version
          mvn -version

      - name: Executar testes
        run: mvn -B -ntp clean test


  docker:

    name: Validar Docker

    runs-on: ubuntu-latest

    needs:
      - testes

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: controle-estoque:teste