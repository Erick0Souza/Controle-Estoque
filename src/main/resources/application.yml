spring:

  application:
    name: estoque-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${APP_JWT_SECRET:chave-local-desenvolvimento-estoque-api-2026-super-segura}