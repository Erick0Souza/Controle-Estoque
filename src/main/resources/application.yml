spring:

  application:
    name: estoque-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}

          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8081}

app:

  jwt:
    secret: ${APP_JWT_SECRET:chave-local-desenvolvimento-estoque-api-2026-super-segura}

  url: ${APP_URL:http://localhost:8081}

  mail:
    remetente: ${MAIL_FROM:${MAIL_USERNAME:}}

  recuperacao-senha:
    expiracao-minutos: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}